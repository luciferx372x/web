<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zum Discord – Frankfurt RP</title>
  <meta name="robots" content="noindex">
  <!-- Kurzer Link: frankfurt-rp.xyz/discord führt zur Discord-Einladung.
       Die Einladung kommt aus der Verwaltung (Einstellungen, Discord-Link). Der feste Link unten gilt nur,
       wenn JavaScript nicht läuft oder die Einstellungen nicht geladen werden können. -->
  <meta http-equiv="refresh" content="4; url=https://discord.gg/vYrSJ22vrX">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08080b; color: #f4f4f6; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    a { color: #ff6a55; }
  </style>
</head>
<body>
  <p>Du wirst zum Discord weitergeleitet … <a id="weiter" href="https://discord.gg/vYrSJ22vrX">Hier klicken, falls nichts passiert.</a></p>
  <script>
    (function () {
      fetch('einstellungen.json', { cache: 'no-cache' }).then(function (antwort) { return antwort.json(); }).then(function (daten) {
        var ziel = daten && typeof daten.discord_url === 'string' ? daten.discord_url.trim() : '';
        if (/^https:\/\/\S+$/.test(ziel)) {
          document.getElementById('weiter').href = ziel;
          location.replace(ziel);
        }
      }).catch(function () { /* der feste Link bleibt */ });
    })();
  </script>
</body>
</html>
