# Konfiguration der Verwaltung (admin.html).
# Diese Datei ist öffentlich lesbar: Hier dürfen nie Passwörter oder Zugangsschlüssel stehen.

backend:
  name: github
  repo: luciferx372x/web
  branch: main

# Bilder, die in der Verwaltung hochgeladen werden (Website, Design), landen im Ordner bilder im Repository.
# Die Standardbilder der Website liegen im Hauptordner und werden hier nicht benutzt.
media_folder: /bilder
public_folder: /bilder
media_library:
  name: default
  config:
    max_file_size: 1572864
    slugify_filename: true

collections:
  - name: einstellungen
    label: Einstellungen
    files:
      - name: allgemein
        label: Rote Leiste, Links und Fußzeile
        file: einstellungen.json
        fields:
          - label: Server-Status
            name: server_status
            widget: select
            default: eigener_text
            options:
              - { label: Eigener Text (wie bisher), value: eigener_text }
              - { label: Server online (grün), value: online }
              - { label: Wartungsarbeiten (orange), value: wartung }
              - { label: Server offline (rot), value: offline }
              - { label: Server im Aufbau (rot), value: im_aufbau }
            hint: "Bei Online, Wartung, Offline und Im Aufbau steht in der Leiste ein fertiger Text und die Leiste ändert ihre Farbe. Bei „Eigener Text“ gilt der Text darunter. Ändert man den Status und speichert, kann eine Nachricht nach Discord gehen (nur wenn die Discord-Meldung bei GitHub eingerichtet ist, siehe Anleitung)."
          - label: Zusatztext für Discord
            name: status_discord_text
            widget: text
            required: false
            hint: "Freiwillig. Steht in der Discord-Nachricht, wenn du den Status oder diesen Text änderst und speicherst, zum Beispiel: Wartung bis 20 Uhr. Leeren löst keine Nachricht aus."
          - label: Text in der roten Leiste
            name: status_text
            widget: string
            required: false
            hint: "Zum Beispiel: Server im Aufbau. Wenn du das Feld leer lässt, verschwindet die rote Leiste."
          - label: Text auf dem Knopf in der roten Leiste
            name: status_button_text
            widget: string
            required: false
            hint: "Zum Beispiel: in arbeit oder Discord beitreten."
          - label: Link des Knopfs
            name: status_link
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Muss mit https:// beginnen. Ohne Text und Link verschwindet der Knopf."
          - label: Text des Beitreten-Knopfs
            name: verbinden_text
            widget: string
            required: false
            hint: "Zum Beispiel: Server beitreten. Leer lassen für den Standardtext."
          - label: Link zum Beitreten
            name: verbinden_link
            widget: string
            required: false
            pattern: ['^(https://.+)?$', 'Der Link muss mit https:// beginnen.']
            hint: "Zum Beispiel https://cfx.re/join/abc123. Wenn du das Feld leer lässt, gibt es keinen Beitreten-Knopf."
          - label: Discord-Link
            name: discord_url
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Link hinter dem Discord-Symbol. Leer lassen, dann verschwindet das Symbol."
          - label: TikTok-Link
            name: tiktok_url
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Link hinter dem TikTok-Symbol. Leer lassen, dann verschwindet das Symbol."
          - label: YouTube-Link
            name: youtube_url
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Link hinter dem YouTube-Symbol. Leer lassen, dann verschwindet das Symbol."
          - label: Stand-Angabe in der Fußzeile
            name: stand
            widget: string
            required: false
            hint: "Schreibe {monat}, dann setzt die Seite den Monat der letzten Änderung selbst ein. Zum Beispiel: Stand: {monat}. Leer lassen, dann steht dort nichts."

  - name: team
    label: Team
    files:
      - name: team
        label: Teammitglieder
        file: team.json
        fields:
          - label: Teammitglieder
            name: mitglieder
            label_singular: Mitglied
            widget: list
            summary: "{{fields.rolle}}: {{fields.name}}"
            hint: "Die Reihenfolge lässt sich per Ziehen ändern. Mit dem Plus kommt eine Person dazu."
            fields:
              - { label: Rolle, name: rolle, widget: string, hint: "Zum Beispiel: Moderator" }
              - { label: Name, name: name, widget: string }

  - name: regelwerke
    label: Regelwerke
    description: "Hier bearbeitest du die Texte der Regelwerke. Du schreibst wie in einem Textprogramm, die Seite übernimmt die Gestaltung."
    files:
      - name: regelwerk_allgemein
        label: Regelwerk (allgemein)
        file: regeln-allgemein.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."
      - name: regelwerk_ht
        label: Regelwerk HT
        file: regeln-ht.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."
      - name: regelwerk_at
        label: Regelwerk AT
        file: regeln-at.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."
      - name: regelwerk_polizei
        label: Polizei-Regelwerk
        file: regeln-polizei.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."
      - name: regelwerk_medic
        label: Medic-Regelwerk
        file: regeln-medic.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."
      - name: regelwerk_illegale
        label: Regelwerk für Illegale Fraktionen
        file: regeln-illegale.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."

  - name: website
    label: Website
    description: "Menü, Fußzeile, Überschriften, Texte der Startseite, Farben, Bilder und Overlays."
    files:
      - name: seiteninhalte
        label: Menü, Fußzeile und Disclaimer
        file: seiteninhalte.json
        fields:
          - { label: Name der Website, name: markenname, widget: string, hint: "Steht oben links neben dem Logo." }
          - label: Hauptmenü
            name: navigation
            label_singular: Menüpunkt
            widget: list
            summary: "{{fields.text}}"
            hint: "Die Reihenfolge lässt sich per Ziehen ändern. Beim Ziel steht entweder der Dateiname einer Seite, zum Beispiel team.html, oder ein kompletter Link mit https://."
            fields:
              - { label: Text, name: text, widget: string }
              - { label: Ziel, name: ziel, widget: string, pattern: ['^(https://[^ ]+|[A-Za-z0-9][A-Za-z0-9._\-]*\.html(\?[A-Za-z0-9=&_.\-]*)?(#[A-Za-z0-9_\-]+)?)$', 'Erlaubt sind Dateinamen wie team.html oder Links mit https://.'], hint: "Dateiname einer Seite oder Link mit https://" }
          - label: Regelwerke
            name: regelwerke
            label_singular: Regelwerk
            widget: list
            summary: "{{fields.text}}"
            hint: "Diese Liste erscheint als Knöpfe auf der Startseite und als Auswahlleiste auf den Regelwerk-Seiten. Der Menüpunkt, der auf das erste Regelwerk zeigt, bleibt auf allen Regelwerk-Seiten markiert."
            fields:
              - { label: Text auf dem Knopf, name: text, widget: string }
              - { label: Kurzer Text für die Auswahlleiste, name: kurztext, widget: string }
              - { label: Ziel, name: ziel, widget: string, pattern: ['^(https://[^ ]+|[A-Za-z0-9][A-Za-z0-9._\-]*\.html(\?[A-Za-z0-9=&_.\-]*)?(#[A-Za-z0-9_\-]+)?)$', 'Erlaubt sind Dateinamen wie team.html oder Links mit https://.'], hint: "Dateiname einer Seite oder Link mit https://" }
          - label: Links in der Fußzeile
            name: fusslinks
            label_singular: Link
            widget: list
            summary: "{{fields.text}}"
            hint: "Die Reihenfolge lässt sich per Ziehen ändern."
            fields:
              - { label: Text, name: text, widget: string }
              - { label: Ziel, name: ziel, widget: string, pattern: ['^(https://[^ ]+|[A-Za-z0-9][A-Za-z0-9._\-]*\.html(\?[A-Za-z0-9=&_.\-]*)?(#[A-Za-z0-9_\-]+)?)$', 'Erlaubt sind Dateinamen wie team.html oder Links mit https://.'], hint: "Dateiname einer Seite oder Link mit https://" }
          - { label: Text des Zurück-Knopfs, name: zurueck_text, widget: string, hint: "Steht oben auf den Unterseiten." }
          - { label: Überschrift des Disclaimers, name: disclaimer_titel, widget: string }
          - { label: Text des Disclaimers, name: disclaimer_text, widget: text, hint: "Steht unten in der Fußzeile. Die Stand-Angabe darüber änderst du unter Einstellungen." }
      - name: seitentitel
        label: Überschriften und Titel der Seiten
        file: seitentitel.json
        fields:
          - label: Seiten
            name: seiten
            label_singular: Seite
            widget: list
            summary: "{{fields.datei}}"
            hint: "Für jede Seite gibt es einen Eintrag. Die Datei bestimmt, zu welcher Seite er gehört."
            fields:
              - { label: Datei, name: datei, widget: select, options: [index.html, regelwerk.html, regelwerk-ht.html, regelwerk-at.html, pol-regelwerk.html, medic-regelwerk.html, regelwerk-illegale-fraktionen.html, team.html, nutzungsbedingungen.html, datenschutz.html, impressum.html] }
              - { label: Überschrift auf der Seite, name: ueberschrift, widget: string }
              - { label: Titel im Browser-Tab, name: browsertitel, widget: string }
              - { label: Kurzbeschreibung für Suchmaschinen, name: beschreibung, widget: text, required: false }
      - name: startseite
        label: Startseite
        file: startseite.json
        fields:
          - { label: Beschreibung des großen Banners, name: hero_alt, widget: string, required: false, hint: "Wird von Screenreadern vorgelesen und erscheint, wenn das Bild nicht lädt." }
          - { label: Überschrift der Regelwerk-Karte, name: regeln_ueberschrift, widget: string, hint: "Unsichtbar, nur für Screenreader." }
          - { label: Beschreibung des Regelwerk-Banners, name: regeln_bild_alt, widget: string, required: false }
          - { label: Überschrift der Social-Media-Karte, name: social_ueberschrift, widget: string, hint: "Unsichtbar, nur für Screenreader." }
          - { label: Beschreibung des Social-Media-Banners, name: social_bild_alt, widget: string, required: false }
      - name: design
        label: Design (Farben und Bilder)
        file: design.json
        fields:
          - label: Hauptfarbe
            name: farbe_haupt
            widget: color
            default: "#fa3019"
            allowInput: true
            hint: "Das Rot der Links, Knöpfe, Balken und Hervorhebungen. Hellere und dunklere Töne werden daraus berechnet. Standard: #fa3019. Die Bilder (zum Beispiel das Logo) ändern sich dadurch nicht."
          - label: Farbe der oberen Leiste
            name: farbe_leiste
            widget: color
            default: "#ff0000"
            allowInput: true
            hint: "Die schmale Leiste ganz oben. Steht der Server-Status auf Online oder Wartung, ist sie grün oder orange. Standard: #ff0000."
          - label: Logo
            name: bild_logo
            widget: image
            required: false
            choose_url: false
            hint: "Oben links neben dem Namen. Quadratisch, mindestens 128 mal 128 Pixel, am besten PNG mit transparentem Hintergrund, höchstens 1,5 MB. Leer lassen für das Standard-Logo."
          - label: Symbol im Browser-Tab (Favicon)
            name: bild_favicon
            widget: image
            required: false
            choose_url: false
            hint: "Das kleine Symbol im Browser-Tab. Quadratisch, 64 mal 64 Pixel oder größer, am besten PNG. Leer lassen für das Standard-Symbol."
          - label: Hintergrundbild der Website
            name: bild_hintergrund
            widget: image
            required: false
            choose_url: false
            hint: "Hintergrund der ganzen Website und der Fußzeile, wird stark abgedunkelt. Breit, zum Beispiel 2048 mal 768 Pixel, am besten JPG, höchstens 1,5 MB. Leer lassen für das Standard-Bild."
          - label: Kopfbild der Unterseiten
            name: bild_kopf
            widget: image
            required: false
            choose_url: false
            hint: "Der schmale Streifen hinter der Überschrift auf den Unterseiten. Sehr breit, zum Beispiel 2048 mal 300 Pixel, am besten JPG, höchstens 1,5 MB. Leer lassen für das Standard-Bild."
          - label: Großes Banner der Startseite
            name: bild_startseite_banner
            widget: image
            required: false
            choose_url: false
            hint: "Das große Bild oben auf der Startseite. Format 8 zu 3, zum Beispiel 2048 mal 768 Pixel, am besten JPG, höchstens 1,5 MB. Leer lassen für das Standard-Banner."
          - label: Bild bei den Regelwerken (Startseite)
            name: bild_startseite_regeln
            widget: image
            required: false
            choose_url: false
            hint: "Das Bild über den Regelwerk-Knöpfen auf der Startseite. Format 8 zu 3, zum Beispiel 2048 mal 768 Pixel, am besten JPG, höchstens 1,5 MB. Leer lassen für das Standard-Bild."
          - label: Bild bei den Social-Media-Symbolen (Startseite)
            name: bild_startseite_social
            widget: image
            required: false
            choose_url: false
            hint: "Das Bild über den Symbolen für Discord und TikTok auf der Startseite. Format 8 zu 3, zum Beispiel 2048 mal 768 Pixel, am besten JPG, höchstens 1,5 MB. Leer lassen für das Standard-Bild."
          - label: Bild der Team-Seite
            name: bild_team
            widget: image
            required: false
            choose_url: false
            hint: "Das Bild oben auf der Team-Seite. Format 8 zu 3, zum Beispiel 2048 mal 768 Pixel, am besten JPG, höchstens 1,5 MB. Leer lassen für das Standard-Bild."
      - name: overlays
        label: Overlays (Schnee, Feuerwerk und mehr)
        file: overlays.json
        fields:
          - { label: Overlays erlauben, name: overlays_an, widget: boolean, default: true, hint: "Hauptschalter. Aus = es erscheint nie ein Overlay, auch nicht in einem eingetragenen Zeitraum." }
          - { label: Schalter für Besucher anzeigen, name: schalter, widget: boolean, default: true, hint: "Zeigt unten rechts einen kleinen Schalter, zum Beispiel Winter-Edition oder Original. So kann jeder die normale Seite ohne Effekt wählen. Der Browser merkt sich diese Wahl 90 Tage lang. Aus = es gibt keinen Schalter, der Effekt läuft immer." }
          - label: Zeiträume
            name: eintraege
            label_singular: Zeitraum
            widget: list
            summary: "{{fields.name}}"
            hint: "Gilt heute mehr als ein Zeitraum, zählt der oberste. Zum Ausprobieren ohne Warten: Schreibe hinter die Adresse der Website zum Beispiel ?overlay=schnee (weitere Namen: weihnachten, sterne, konfetti, feuerwerk, laub, halloween, herzen, ostern). Mit ?overlaydatum=2026-12-24 siehst du, was an einem bestimmten Tag gelten würde. Bei „weniger Bewegung“ im Betriebssystem bleibt jedes Overlay aus."
            fields:
              - { label: Name, name: name, widget: string, hint: "Nur für dich, zum Beispiel Weihnachten." }
              - label: Effekt
                name: effekt
                widget: select
                default: schnee
                options:
                  - { label: Schneefall, value: schnee }
                  - { label: Weihnachten (Schnee und funkelnde Sterne), value: weihnachten }
                  - { label: Funkelnde Sterne, value: sterne }
                  - { label: Konfetti, value: konfetti }
                  - { label: Feuerwerk, value: feuerwerk }
                  - { label: Herbstlaub, value: laub }
                  - { label: "Halloween (Kürbisse, Geister, Fledermäuse)", value: halloween }
                  - { label: Herzen (Valentinstag), value: herzen }
                  - { label: Ostern (Eier und Blumen), value: ostern }
              - { label: Name der Edition auf dem Schalter, name: bezeichnung, widget: string, required: false, hint: "Zum Beispiel Winter-Edition oder Halloween-Edition. Leer lassen = passender Name zum Effekt (Schnee: Winter-Edition, Halloween: Halloween-Edition, Ostern: Oster-Edition und so weiter). Höchstens 40 Zeichen." }
              - { label: Von, name: von, widget: string, required: false, pattern: ['^(\d{1,2}\.\d{1,2}\.(\d{4})?)?$', 'Bitte so schreiben: 01.12. (gilt jedes Jahr) oder 01.12.2026 (nur in diesem Jahr).'], hint: "Erster Tag, zum Beispiel 01.12. (jedes Jahr) oder 01.12.2026 (nur ein Jahr). Beide Felder leer lassen = immer." }
              - { label: Bis, name: bis, widget: string, required: false, pattern: ['^(\d{1,2}\.\d{1,2}\.(\d{4})?)?$', 'Bitte so schreiben: 26.12. (gilt jedes Jahr) oder 26.12.2026 (nur in diesem Jahr).'], hint: "Letzter Tag, der noch mitzählt, zum Beispiel 26.12. Über den Jahreswechsel geht es auch: von 31.12. bis 01.01." }
              - label: Stärke
                name: staerke
                widget: select
                default: normal
                options:
                  - { label: Wenig, value: wenig }
                  - { label: Normal, value: normal }
                  - { label: Viel, value: viel }
              - { label: Eingeschaltet, name: aktiv, widget: boolean, default: true, hint: "Aus = dieser Zeitraum wird übersprungen." }

  - name: eigene_seiten
    label: Eigene Seiten
    description: "Zusätzliche Seiten wie Neuigkeiten, Bewerbung oder FAQ. Jede Seite ist unter seite.html?s=KENNUNG erreichbar."
    files:
      - name: seiten
        label: Alle eigenen Seiten
        file: seiten.json
        fields:
          - label: Adresse des Formular-Relais
            name: formular_adresse
            widget: string
            required: false
            pattern: ['^(https://[^ ]+)?$', 'Die Adresse muss mit https:// beginnen.']
            hint: "Erst eintragen, wenn das Relais bei Cloudflare eingerichtet ist (siehe Anleitung). Die Adresse endet meist auf .workers.dev. Ohne Adresse funktioniert kein Formular."
          - label: Seiten
            name: seiten
            label_singular: Seite
            widget: list
            summary: "{{fields.titel}}"
            hint: "Neue Seite: unten auf Hinzufügen klicken. Ist „Sichtbar“ ausgeschaltet, ist die Seite ein Entwurf, den niemand sieht. Mit „Im Menü anzeigen“ hängt sie am Ende des Hauptmenüs."
            fields:
              - { label: Titel, name: titel, widget: string, hint: "Große Überschrift der Seite und Titel im Browser-Tab." }
              - { label: Kennung, name: kennung, widget: string, pattern: ['^[a-z0-9][a-z0-9\-]*$', 'Nur kleine Buchstaben, Zahlen und Bindestriche, zum Beispiel neuigkeiten.'], hint: "Kurzer Name für den Link, zum Beispiel neuigkeiten. Die Seite ist dann unter seite.html?s=neuigkeiten erreichbar. Nach dem Veröffentlichen nicht mehr ändern, sonst stimmen alte Links nicht mehr." }
              - { label: Sichtbar, name: sichtbar, widget: boolean, default: false, hint: "Aus = Entwurf, die Seite ist nicht erreichbar. An = die Seite ist öffentlich." }
              - { label: Im Menü anzeigen, name: im_menue, widget: boolean, default: false, hint: "Hängt die Seite ans Ende des Hauptmenüs, aber nur, wenn sie sichtbar ist." }
              - { label: Fragen aufklappbar anzeigen, name: aufklappbar, widget: boolean, default: false, hint: "Für eine FAQ: Jede Überschrift 3 wird zu einer aufklappbaren Frage, der Text darunter ist die Antwort." }
              - { label: Text im Menü, name: menuetext, widget: string, required: false, hint: "Leer lassen, dann steht im Menü der Titel." }
              - { label: Kurzbeschreibung für Suchmaschinen, name: beschreibung, widget: text, required: false }
              - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter der Überschrift. Schreibe {monat}, dann steht dort automatisch der Monat der letzten Änderung, zum Beispiel: Stand: {monat}. Kann leer bleiben." }
              - label: Text
                name: inhalt
                widget: markdown
                buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
                editor_components: [hr]
                hint: "Zeilenumbruch innerhalb eines Absatzes mit Umschalt+Enter, neuer Absatz mit Enter. Links auf andere Seiten dieser Website schreibst du als Dateiname, zum Beispiel team.html oder seite.html?s=neuigkeiten."
              - label: Formular unter dem Text
                name: formular
                widget: object
                collapsed: true
                required: false
                hint: "Zum Beispiel für eine Bewerbung. Die Antworten kommen als Nachricht in einen Discord-Kanal. Das Formular funktioniert erst, wenn oben die Adresse des Formular-Relais eingetragen ist."
                fields:
                  - { label: Formular anzeigen, name: aktiv, widget: boolean, default: false, hint: "Aus = kein Formular auf dieser Seite." }
                  - { label: Kanal-Kürzel, name: kanal, widget: string, default: bewerbung, pattern: ['^[a-z0-9][a-z0-9\-]{0,29}$', 'Nur kleine Buchstaben, Zahlen und Bindestriche.'], hint: "Bestimmt, in welchen Discord-Kanal die Antworten gehen. Im Formular-Relais muss ein passender Eintrag stehen (bewerbung gehört zu WEBHOOK_BEWERBUNG)." }
                  - label: Fragen
                    name: felder
                    label_singular: Frage
                    widget: list
                    summary: "{{fields.frage}}"
                    hint: "Die Reihenfolge lässt sich per Ziehen ändern."
                    fields:
                      - { label: Frage, name: frage, widget: string }
                      - label: Art der Antwort
                        name: typ
                        widget: select
                        default: kurztext
                        options:
                          - { label: Kurzer Text, value: kurztext }
                          - { label: Langer Text, value: langtext }
                          - { label: Auswahl aus einer Liste, value: auswahl }
                          - { label: Zahl, value: zahl }
                          - { label: Häkchen zum Bestätigen, value: bestaetigung }
                      - { label: Pflichtfeld, name: pflicht, widget: boolean, default: true }
                      - { label: Hinweis unter der Frage, name: hinweis, widget: string, required: false }
                      - { label: Auswahlmöglichkeiten, name: optionen, widget: text, required: false, hint: "Nur bei „Auswahl aus einer Liste“: eine Möglichkeit pro Zeile." }
                      - { label: Kleinster Wert, name: min, widget: number, value_type: int, required: false, hint: "Nur bei „Zahl“, zum Beispiel 16 für ein Mindestalter." }
                      - { label: Größter Wert, name: max, widget: number, value_type: int, required: false, hint: "Nur bei „Zahl“." }
                  - { label: Text der Einwilligung, name: einwilligung, widget: text, required: false, hint: "Steht neben dem Pflicht-Häkchen. Der Link zur Datenschutzerklärung wird automatisch angehängt." }
                  - { label: Text auf dem Absende-Knopf, name: knopf, widget: string, required: false, default: Absenden }
                  - { label: Text nach dem Absenden, name: erfolg, widget: text, required: false, hint: "Wird nach dem erfolgreichen Absenden angezeigt." }

