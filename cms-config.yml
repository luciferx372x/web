# Konfiguration der Verwaltung (admin.html).
# Diese Datei ist öffentlich lesbar: Hier dürfen nie Passwörter oder Zugangsschlüssel stehen.

backend:
  name: github
  repo: luciferx372x/web
  branch: main

# Bilder liegen im Hauptordner des Repositories (in der Verwaltung noch nicht benutzt).
media_folder: /
public_folder: /

collections:
  - name: einstellungen
    label: Einstellungen
    files:
      - name: allgemein
        label: Rote Leiste, Links und Fußzeile
        file: einstellungen.json
        fields:
          - label: Text in der roten Leiste
            name: status_text
            widget: string
            required: false
            hint: "Zum Beispiel: Server im Aufbau. Wenn du das Feld leer lässt, verschwindet die rote Leiste."
          - label: Text auf dem Knopf in der roten Leiste
            name: status_button_text
            widget: string
            required: false
            hint: "Zum Beispiel: in arbeit oder Discord beitreten."
          - label: Link des Knopfs
            name: status_link
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Muss mit https:// beginnen. Ohne Text und Link verschwindet der Knopf."
          - label: Discord-Link
            name: discord_url
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Link hinter dem Discord-Symbol. Leer lassen, dann verschwindet das Symbol."
          - label: TikTok-Link
            name: tiktok_url
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Link hinter dem TikTok-Symbol. Leer lassen, dann verschwindet das Symbol."
          - label: YouTube-Link
            name: youtube_url
            widget: string
            required: false
            pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.']
            hint: "Link hinter dem YouTube-Symbol. Leer lassen, dann verschwindet das Symbol."
          - label: Stand-Angabe in der Fußzeile
            name: stand
            widget: string
            required: false
            hint: "Zum Beispiel: Stand: 08.2026"

  - name: team
    label: Team
    files:
      - name: team
        label: Teammitglieder
        file: team.json
        fields:
          - label: Teammitglieder
            name: mitglieder
            label_singular: Mitglied
            widget: list
            summary: "{{fields.rolle}}: {{fields.name}}"
            hint: "Die Reihenfolge lässt sich per Ziehen ändern. Mit dem Plus kommt eine Person dazu."
            fields:
              - { label: Rolle, name: rolle, widget: string, hint: "Zum Beispiel: Moderator" }
              - { label: Name, name: name, widget: string }

  - name: regelwerke
    label: Regelwerke
    description: "Hier bearbeitest du die Texte der Regelwerke. Du schreibst wie in einem Textprogramm, die Seite übernimmt die Gestaltung."
    files:
      - name: regelwerk_allgemein
        label: Regelwerk (allgemein)
        file: regeln-allgemein.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel, zum Beispiel: Stand: 11.08.2026. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
            name: inhalt
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, heading-four, bulleted-list, numbered-list, quote]
            editor_components: [hr]
            hint: "Schreibe die Regelnummer an den Anfang der Zeile, zum Beispiel 1.1. mit Punkt und Leerzeichen danach, dann erscheint sie links in Rot. Abschnitte mit Überschrift 2, Unterabschnitte mit Überschrift 3 oder 4. Eine Aufzählung direkt unter einer Regel gehört zu dieser Regel. Zitat ergibt einen farbigen Hinweiskasten. Eine Trennlinie macht alles danach zur Schlussbemerkung. Enter beginnt einen neuen Absatz, Umschalt+Enter einen Zeilenumbruch."
      - name: regelwerk_ht
        label: Regelwerk HT
        file: regeln-ht.json
        fields:
          - { label: Dokumenttitel, name: dokumenttitel, widget: string, required: false, hint: "Kleine Zeile über dem Text." }
          - { label: Stand, name: stand, widget: string, required: false, hint: "Kleine Zeile unter dem Titel, zum Beispiel: Stand: 11.08.2026. Leer lassen, wenn nichts angezeigt werden soll." }
          - label: Text
